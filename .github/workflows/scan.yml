name: scan

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub treats this as approximate; runs can be delayed several minutes
  workflow_dispatch:          # lets you press "Run workflow" manually

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Settle finished games, then scan for new candidates
        run: python -m kalshi_scanner run
        env:
          # Optional override, e.g. "KXMLBGAME,KXNHLGAME,KXNBAGAME". Set under Settings > Variables.
          KALSHI_SERIES: ${{ vars.KALSHI_SERIES }}

      - name: Commit new data
        run: |
          git config user.name "kalshi-scanner-bot"
          git config user.email "kalshi-scanner-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
