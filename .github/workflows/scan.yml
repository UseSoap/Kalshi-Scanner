name: scan

# Each run starts a "loop" that scans every 45-90 seconds while games are in their watch
# windows, waits if a window is about to open, and exits early when nothing is on.
#
# Self-chaining: when a loop ends because its 27-minute budget ran out (games are still being
# watched), the last step dispatches this workflow again. The new run queues behind the current
# one (see `concurrency`) and starts as soon as it finishes, so coverage is near-continuous.
# When the loop ends because nothing is on ("idle"), it does not chain.
#
# Starting runs: GitHub's own cron is best-effort and often drops runs, so the primary trigger
# is an external scheduler (cron-job.org, timezone America/Chicago) that calls this workflow's
# `workflow_dispatch` API at :02 and :32 during game hours (11 AM - 1:59 AM Central) and at :02
# hourly overnight. The single cron entry below is only a failsafe in case that service fails.
# Its minute is :47 on purpose: GitHub delays or drops scheduled runs at :00 and :30 when busy.
on:
  schedule:
    - cron: "47 * * * *"             # failsafe: hourly; an idle run exits within seconds
  workflow_dispatch:                  # started by cron-job.org, the chain, or the "Run workflow" button

permissions:
  contents: write   # commit data
  actions: write    # dispatch the next run of this workflow

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Settle finished games, then scan (adaptive loop)
        id: scan
        run: python -m kalshi_scanner loop --max-minutes 27
        env:
          # Optional override, e.g. "KXMLBGAME,KXNHLGAME,KXNBAGAME". Set under Settings > Variables.
          KALSHI_SERIES: ${{ vars.KALSHI_SERIES }}

      - name: Commit new data
        if: always()
        run: |
          git config user.name "kalshi-scanner-bot"
          git config user.email "kalshi-scanner-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

      # Runs after the commit so the next run checks out the data this one just pushed.
      # Skipped when the loop crashed (no output) or found nothing to watch; the cron restarts it.
      - name: Chain the next run
        if: always() && steps.scan.outputs.again == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run scan.yml --ref "${{ github.ref_name }}"
