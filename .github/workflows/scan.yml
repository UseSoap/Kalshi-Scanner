name: scan

# Each run starts a "loop" that scans every 30-60 seconds while games are in their watch
# windows, waits if a window is about to open, and exits early when nothing is on. The cron
# entries below only decide when a run may *start*; the loop itself decides how hard to work.
# Minutes are :07/:37 on purpose: GitHub delays or drops scheduled runs at :00 and :30 when it is busy.
on:
  schedule:
    - cron: "7,37 16-23,0-6 * * *"   # game hours: 11 AM - 1:59 AM Central (CDT), every 30 min at :07 and :37
    - cron: "7 7-15 * * *"           # overnight/morning: hourly check (exits within seconds when idle)
  workflow_dispatch:                  # press "Run workflow" to start one manually

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Settle finished games, then scan (adaptive loop)
        run: python -m kalshi_scanner loop --max-minutes 27
        env:
          # Optional override, e.g. "KXMLBGAME,KXNHLGAME,KXNBAGAME". Set under Settings > Variables.
          KALSHI_SERIES: ${{ vars.KALSHI_SERIES }}

      - name: Commit new data
        if: always()
        run: |
          git config user.name "kalshi-scanner-bot"
          git config user.email "kalshi-scanner-bot@users.noreply.github.com"
          mkdir -p data
          git add -A data
          if git diff --cached --quiet; then
            echo "No new data."
          else
            git commit -m "data: scan $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
